services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mobile-game-hunt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobile_game_hunt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobile_game_hunt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: mobile-game-hunt-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Next.js Application (PROD)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile-game-hunt-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
        #- DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/mobile_game_hunt
        #- REDIS_URL=redis://redis:6379
      - REDIS_URL=redis://mobile-game-hunt-redis:6379
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@mobile-game-hunt-db:5432/mobile_game_hunt?connect_timeout=5&pool_timeout=5
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://mobilegamehunt.com}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AUTH_TRUST_HOST=true
      - SEARCHAPI_API_KEY=${SEARCHAPI_API_KEY}
      - SEARCHAPI_BASE_URL=${SEARCHAPI_BASE_URL:-https://www.searchapi.io/api/v1/search}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

    # ✅ Upload açık (rw) ama çalıştırma/ayrıcalık yok
    volumes:
      - app_uploads:/app/public/uploads:rw,noexec,nosuid,nodev

    # ✅ En kritik: non-root
    user: "1001:1001"

    # ✅ Root filesystem kilitli (uploads volume + cache/tmp tmpfs)
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
      # - /tmp:uid=1001,gid=1001,mode=1777
      #- /app/.next:uid=1001,gid=1001,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Fail-safe limitler
    pids_limit: 200
    mem_limit: 1g
    cpus: "1.5"

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mobile-game-hunt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - app_uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - app
    networks:
      - app-network

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: mobile-game-hunt-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - app-network
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local